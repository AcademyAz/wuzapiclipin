services:
  wuzapi-server:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      WUZAPI_ADDRESS: 0.0.0.0
      WUZAPI_PORT: 8080
      WUZAPI_ADMIN_TOKEN: ${WUZAPI_ADMIN_TOKEN:?WUZAPI_ADMIN_TOKEN is required}
      WUZAPI_GLOBAL_ENCRYPTION_KEY: ${WUZAPI_GLOBAL_ENCRYPTION_KEY:?WUZAPI_GLOBAL_ENCRYPTION_KEY is required}
      WUZAPI_GLOBAL_HMAC_KEY: ${WUZAPI_GLOBAL_HMAC_KEY:?WUZAPI_GLOBAL_HMAC_KEY is required}
      WUZAPI_GLOBAL_WEBHOOK: ${WUZAPI_GLOBAL_WEBHOOK:-}
      WUZAPI_WEBHOOK_USE_PROXY: ${WUZAPI_WEBHOOK_USE_PROXY:-false}
      WEBHOOK_FORMAT: ${WEBHOOK_FORMAT:-json}
      WEBHOOK_RETRY_ENABLED: ${WEBHOOK_RETRY_ENABLED:-true}
      WEBHOOK_RETRY_COUNT: ${WEBHOOK_RETRY_COUNT:-5}
      WEBHOOK_RETRY_DELAY_SECONDS: ${WEBHOOK_RETRY_DELAY_SECONDS:-30}
      SESSION_DEVICE_NAME: ${SESSION_DEVICE_NAME:-ClipIn}
      DB_USER: ${DB_USER:-wuzapi}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:-wuzapi}
      DB_HOST: db
      DB_PORT: 5432
      DB_SSLMODE: ${DB_SSLMODE:-false}
      TZ: ${TZ:-America/Sao_Paulo}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wuzapi-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    init: true
    stop_grace_period: 20s
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-wuzapi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-wuzapi}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - wuzapi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s
    restart: unless-stopped

networks:
  wuzapi-network:
    driver: bridge

volumes:
  db_data:
